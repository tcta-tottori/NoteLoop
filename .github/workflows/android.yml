name: Android APK

# Android SDK の取得元（dl.google.com）は開発環境から到達できないため、
# APK のビルドは CI で行い、成果物としてダウンロードできるようにする。
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK を用意
        uses: android-actions/setup-android@v3

      - name: 依存関係をインストール
        run: npm ci

      - name: Web アセットを www/ へ集めて Android へ同期
        run: |
          npm run build
          npx cap sync android

      - name: APK をビルド
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: APK に分かりやすい名前を付ける
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "dist/NOTELOOP-${GITHUB_SHA::7}.apk"
          ls -lh dist

      - name: APK をアップロード
        uses: actions/upload-artifact@v4
        with:
          name: NOTELOOP-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 90
